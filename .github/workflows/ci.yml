name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  stack:
    name: Docker Compose stack smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Start the stack
        run: docker compose up -d --build
      - name: API readiness (db, redis, storage)
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:4000/health/ready; then echo; exit 0; fi
            sleep 3
          done
          exit 1
      - name: Liveness, web, schema, worker
        run: |
          curl -fsS http://localhost:4000/health | grep -q '"ok"'
          for i in $(seq 1 30); do curl -fsS -o /dev/null http://localhost:3000 && break; sleep 2; done
          curl -fsS http://localhost:3000 | grep -q 'AppealAI'
          docker compose exec -T postgres psql -U appeal -d appeal -tAc \
            "select count(*) from information_schema.tables where table_schema='public' and table_name in ('organizations','users','claims','denials','documents','appeals','policy_docs','policy_chunks','audit_logs')" | grep -qx 9
          docker compose exec -T postgres psql -U appeal -d appeal -tAc "select 1 from pg_extension where extname='vector'" | grep -qx 1
          for i in $(seq 1 20); do docker compose logs worker | grep -q 'heartbeat processed' && exit 0; sleep 2; done
          exit 1
      - name: Service status and logs
        if: always()
        run: |
          docker compose ps -a
          docker compose logs --tail=50
