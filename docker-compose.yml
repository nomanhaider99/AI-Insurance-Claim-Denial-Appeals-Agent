# Local dev stack. Credentials here are dev-only placeholders; real secrets come from env/K8s secrets.
name: appeal-ai

x-api-env: &api-env
  NODE_ENV: production
  LOG_LEVEL: info
  API_PORT: 4000
  WEB_ORIGIN: http://localhost:3000
  DATABASE_URL: postgres://appeal:appeal@postgres:5432/appeal
  REDIS_URL: redis://redis:6379
  S3_ENDPOINT: http://storage:9000
  S3_REGION: us-east-1
  S3_BUCKET: appeal-documents
  S3_ACCESS_KEY: devaccesskey
  S3_SECRET_KEY: devsecretkey-change-me
  JWT_ACCESS_SECRET: dev-only-jwt-secret-change-me-0123456789
  APP_URL: http://localhost:3000
  # Local stack is plain http; production must keep Secure cookies.
  COOKIE_SECURE: 'false'
  MAIL_TRANSPORT: console

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: appeal
      POSTGRES_PASSWORD: appeal
      POSTGRES_DB: appeal
    ports: ['5432:5432']
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U appeal -d appeal']
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ['6379:6379']
    volumes: [redisdata:/data]
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  # S3-compatible object storage (RustFS). MinIO images are no longer published on Docker Hub.
  storage:
    image: rustfs/rustfs:1.0.6
    environment:
      RUSTFS_ACCESS_KEY: devaccesskey
      RUSTFS_SECRET_KEY: devsecretkey-change-me
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: 'true'
    ports: ['9000:9000', '9001:9001']
    volumes: [storagedata:/data]
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:9000/health']
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

  storage-init:
    image: amazon/aws-cli:2.40.4
    depends_on:
      storage: { condition: service_healthy }
    environment:
      AWS_ACCESS_KEY_ID: devaccesskey
      AWS_SECRET_ACCESS_KEY: devsecretkey-change-me
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: ['sh', '-c']
    command:
      - >-
        aws --endpoint-url http://storage:9000 s3api head-bucket --bucket appeal-documents ||
        aws --endpoint-url http://storage:9000 s3api create-bucket --bucket appeal-documents

  migrate:
    build: { context: ., dockerfile: infra/docker/api.Dockerfile }
    image: appeal-ai/api:dev
    command: ['node', 'dist/db/migrate.js']
    environment: *api-env
    depends_on:
      postgres: { condition: service_healthy }

  api:
    image: appeal-ai/api:dev
    pull_policy: never # built by the migrate service
    environment: *api-env
    ports: ['4000:4000']
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      storage-init: { condition: service_completed_successfully }
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 10

  worker:
    image: appeal-ai/api:dev
    pull_policy: never # built by the migrate service
    command: ['node', 'dist/worker.js']
    environment: *api-env
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4000
    ports: ['3000:3000']
    depends_on:
      api: { condition: service_healthy }

volumes:
  pgdata:
  redisdata:
  storagedata:
