# Local dev stack. Credentials here are dev-only placeholders; real secrets come from env/K8s secrets.
name: appeal-ai

x-api-env: &api-env
  NODE_ENV: production
  LOG_LEVEL: info
  API_PORT: 4000
  WEB_ORIGIN: http://localhost:3000
  DATABASE_URL: postgres://appeal:appeal@postgres:5432/appeal
  REDIS_URL: redis://redis:6379
  S3_ENDPOINT: http://minio:9000
  S3_REGION: us-east-1
  S3_BUCKET: appeal-documents
  S3_ACCESS_KEY: minioadmin
  S3_SECRET_KEY: minioadmin

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: appeal
      POSTGRES_PASSWORD: appeal
      POSTGRES_DB: appeal
    ports: ['5432:5432']
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U appeal -d appeal']
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ['6379:6379']
    volumes: [redisdata:/data]
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ['9000:9000', '9001:9001']
    volumes: [miniodata:/data]
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 3s
      retries: 20

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio: { condition: service_healthy }
    entrypoint: >
      sh -c "mc alias set local http://minio:9000 minioadmin minioadmin &&
             mc mb --ignore-existing local/appeal-documents"

  migrate:
    build: { context: ., dockerfile: infra/docker/api.Dockerfile }
    image: appeal-ai/api:dev
    command: ['node', 'dist/db/migrate.js']
    environment: *api-env
    depends_on:
      postgres: { condition: service_healthy }

  api:
    image: appeal-ai/api:dev
    pull_policy: never # built by the migrate service
    environment: *api-env
    ports: ['4000:4000']
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 10

  worker:
    image: appeal-ai/api:dev
    pull_policy: never # built by the migrate service
    command: ['node', 'dist/worker.js']
    environment: *api-env
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4000
    ports: ['3000:3000']
    depends_on:
      api: { condition: service_healthy }

volumes:
  pgdata:
  redisdata:
  miniodata:
